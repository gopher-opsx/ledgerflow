# Small application definition with PostgreSQL and the Transaction API.
# It is not the complete banking pipeline; the API needs reachable Kafka broker configuration.
# Paths resolve relative to this Compose file; credentials are isolated-lab defaults.

services:
  # Defines this service or named volume in the merged Compose project.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ledgerflow
      POSTGRES_DB: ledgerflow
    ports:
      - "5432:5432"
    volumes:
      - ledgerflow-postgres:/var/lib/postgresql/data
      - ../../migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow -d ledgerflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Defines this service or named volume in the merged Compose project.
  transaction-api:
    build:
      context: ../..
      dockerfile: Dockerfile.transaction-api
    environment:
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/transaction-api-healthcheck-placeholder"]
      disable: true

volumes:
  # Defines this service or named volume in the merged Compose project.
  ledgerflow-postgres:
