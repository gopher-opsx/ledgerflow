name: ledgerflow

services:

  postgres:
    image: postgres:16-alpine
    container_name: ledgerflow-postgres
    environment:
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ledgerflow
      POSTGRES_DB: ledgerflow
    ports:
      - "5432:5432"
    volumes:
      - ledgerflow-postgres:/var/lib/postgresql/data
      - ../../migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ledgerflow -d ledgerflow" ]
      interval: 5s
      timeout: 3s
      retries: 20

  controller-1:
    image: apache/kafka:4.3.1
    container_name: ledgerflow-controller-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"

  controller-2:
    image: apache/kafka:4.3.1
    container_name: ledgerflow-controller-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"

  controller-3:
    image: apache/kafka:4.3.1
    container_name: ledgerflow-controller-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"

  broker-1:
    image: apache/kafka:4.3.1
    container_name: ledgerflow-broker-1
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: broker-1

      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://broker-1:19092,
        PLAINTEXT_HOST://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@controller-1:9093,
        2@controller-2:9093,
        3@controller-3:9093

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

    depends_on:
      - controller-1
      - controller-2
      - controller-3

  broker-2:
    image: apache/kafka:4.3.1
    container_name: ledgerflow-broker-2
    ports:
      - "39092:9092"
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: broker
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: broker-2

      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://broker-2:19092,
        PLAINTEXT_HOST://localhost:39092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@controller-1:9093,
        2@controller-2:9093,
        3@controller-3:9093

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

    depends_on:
      - controller-1
      - controller-2
      - controller-3

  broker-3:
    image: apache/kafka:4.3.1
    container_name: ledgerflow-broker-3
    ports:
      - "49092:9092"
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: broker
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: broker-3

      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://broker-3:19092,
        PLAINTEXT_HOST://localhost:49092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@controller-1:9093,
        2@controller-2:9093,
        3@controller-3:9093

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

    depends_on:
      - controller-1
      - controller-2
      - controller-3

  transaction-api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: transaction-api
    container_name: ledgerflow-transaction-api
    environment:
      HTTP_ADDR: ":8080"
      KAFKA_BROKERS: "broker-1:19092,broker-2:19092,broker-3:19092"
      KAFKA_TRANSACTION_TOPIC: "ledgerflow.transactions"
    ports:
      - "8080:8080"
    depends_on:
      - broker-1
      - broker-2
      - broker-3

  ledger-service:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: ledger-service
    container_name: ledgerflow-ledger-service
    environment:
      KAFKA_BROKERS: "broker-1:19092,broker-2:19092,broker-3:19092"
      KAFKA_TRANSACTION_TOPIC: "ledgerflow.transactions"
      DATABASE_URL: "postgres://ledgerflow:ledgerflow@postgres:5432/ledgerflow?sslmode=disable"
    depends_on:
      - broker-1
      - broker-2
      - broker-3
      - postgres

  fraud-service:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: fraud-service
    container_name: ledgerflow-fraud-service
    environment:
      KAFKA_BROKERS: "broker-1:19092,broker-2:19092,broker-3:19092"
      KAFKA_TRANSACTION_TOPIC: "ledgerflow.transactions"
      KAFKA_FRAUD_RESULTS_TOPIC: "ledgerflow.fraud-results"
    depends_on:
      - broker-1
      - broker-2
      - broker-3

  notification-service:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: notification-service
    container_name: ledgerflow-notification-service
    environment:
      KAFKA_BROKERS: "broker-1:19092,broker-2:19092,broker-3:19092"
      KAFKA_TRANSACTION_TOPIC: "ledgerflow.transactions"
      KAFKA_NOTIFICATIONS_TOPIC: "ledgerflow.notifications"
    depends_on:
      - broker-1
      - broker-2
      - broker-3

  jmx-exporter-broker-1:
    image: dhi.io/jmx-exporter:1
    container_name: ledgerflow-jmx-exporter-broker-1
    command:
      - "9404"
      - "/etc/jmx/kafka.yml"
    ports:
      - "9404:9404"
    volumes:
      - ../monitoring/jmx/broker-1.yml:/etc/jmx/kafka.yml:ro
    environment: { }
    depends_on:
      - broker-1

  jmx-exporter-broker-2:
    image: dhi.io/jmx-exporter:1
    container_name: ledgerflow-jmx-exporter-broker-2
    command:
      - "9404"
      - "/etc/jmx/kafka.yml"
    ports:
      - "9405:9404"
    volumes:
      - ../monitoring/jmx/broker-2.yml:/etc/jmx/kafka.yml:ro
    depends_on:
      - broker-2

  jmx-exporter-broker-3:
    image: dhi.io/jmx-exporter:1
    container_name: ledgerflow-jmx-exporter-broker-3
    command:
      - "9404"
      - "/etc/jmx/kafka.yml"
    ports:
      - "9406:9404"
    volumes:
      - ../monitoring/jmx/broker-3.yml:/etc/jmx/kafka.yml:ro
    depends_on:
      - broker-3

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: ledgerflow-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - jmx-exporter-broker-1
      - jmx-exporter-broker-2
      - jmx-exporter-broker-3
      - transaction-api

  grafana:
    image: grafana/grafana-enterprise
    container_name: ledgerflow-grafana

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ledgerflow

    ports:
      - "3000:3000"

    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ledgerflow-grafana:/var/lib/grafana

    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: ledgerflow-alertmanager

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

    ports:
      - "9093:9093"

volumes:
  ledgerflow-postgres:
  ledgerflow-grafana: