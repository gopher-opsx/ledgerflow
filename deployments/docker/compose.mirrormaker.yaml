# Overlay for a secondary Kafka cluster and MirrorMaker 2.
# Merge with the base lab and verify actual records on the destination, not only topic creation.
# Paths resolve relative to this Compose file; credentials are isolated-lab defaults.

services:
  # Defines this service or named volume in the merged Compose project.
  mirror-broker:
    image: apache/kafka:4.3.1
    container_name: ledgerflow-mirror-broker
    environment:
      KAFKA_NODE_ID: 101
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: PLAINTEXT://:19093,CONTROLLER://:19094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://mirror-broker:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 101@mirror-broker:19094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports:
      - "59092:19093"
    volumes:
      - ledgerflow-mirror-broker:/tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19093 >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Defines this service or named volume in the merged Compose project.
  mirrormaker2:
    image: apache/kafka:4.3.1
    container_name: ledgerflow-mirrormaker2
    command:
      - /opt/kafka/bin/connect-mirror-maker.sh
      - /etc/kafka/mm2.properties
    volumes:
      - ../integration/mirrormaker/mm2.properties:/etc/kafka/mm2.properties:ro
    depends_on:
      broker-1:
        condition: service_healthy
      broker-2:
        condition: service_healthy
      broker-3:
        condition: service_healthy
      mirror-broker:
        condition: service_healthy

volumes:
  # Defines this service or named volume in the merged Compose project.
  ledgerflow-mirror-broker:
