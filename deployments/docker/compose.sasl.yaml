# Overlay adding SASL/PLAIN over SSL and broker ACL authorization using lab credentials.
# Client settings, broker health checks, and controller authorization must be rehearsed before recording.
# Paths resolve relative to this Compose file; credentials are isolated-lab defaults.

services:
  # Defines this service or named volume in the merged Compose project.
  broker-1:
    environment: &sasl_env
      KAFKA_LISTENERS: SASL_SSL://:19092,SASL_SSL_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://broker-1:19092,SASL_SSL_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_SSL:SASL_SSL,SASL_SSL_HOST:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_SASL_SSL_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret" user_admin="admin-secret" user_ledgerflow="ledgerflow-secret";
      KAFKA_LISTENER_NAME_SASL_SSL_HOST_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret" user_admin="admin-secret" user_ledgerflow="ledgerflow-secret";
      # The official Kafka Docker entrypoint requires filenames and credential files.
      # Files are mounted at /etc/kafka/secrets and created by make tls-generate.
      KAFKA_SSL_KEYSTORE_FILENAME: broker-1.keystore.p12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore-creds
      KAFKA_SSL_KEY_CREDENTIALS: key-creds
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_FILENAME: truststore.p12
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore-creds
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:admin
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/ledgerflow/sasl/kafka_server_jaas.conf"
    volumes:
      - ../../security/tls:/etc/kafka/secrets:ro
      # Retain the Lesson 27 client-properties truststore path.
      - ../../security/tls:/etc/ledgerflow/security:ro
      - ../../security/sasl:/etc/ledgerflow/sasl:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server broker-1:19092
          --command-config /etc/ledgerflow/sasl/admin.properties
          >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  # Defines this service or named volume in the merged Compose project.
  broker-2:
    environment:
      <<: *sasl_env
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://broker-2:19092,SASL_SSL_HOST://localhost:39092
      KAFKA_SSL_KEYSTORE_FILENAME: broker-2.keystore.p12
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/ledgerflow/sasl/kafka_server_jaas.conf"
    volumes:
      - ../../security/tls:/etc/kafka/secrets:ro
      # Retain the Lesson 27 client-properties truststore path.
      - ../../security/tls:/etc/ledgerflow/security:ro
      - ../../security/sasl:/etc/ledgerflow/sasl:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server broker-2:19092
          --command-config /etc/ledgerflow/sasl/admin.properties
          >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  # Defines this service or named volume in the merged Compose project.
  broker-3:
    environment:
      <<: *sasl_env
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://broker-3:19092,SASL_SSL_HOST://localhost:49092
      KAFKA_SSL_KEYSTORE_FILENAME: broker-3.keystore.p12
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/ledgerflow/sasl/kafka_server_jaas.conf"
    volumes:
      - ../../security/tls:/etc/kafka/secrets:ro
      # Retain the Lesson 27 client-properties truststore path.
      - ../../security/tls:/etc/ledgerflow/security:ro
      - ../../security/sasl:/etc/ledgerflow/sasl:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server broker-3:19092
          --command-config /etc/ledgerflow/sasl/admin.properties
          >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
