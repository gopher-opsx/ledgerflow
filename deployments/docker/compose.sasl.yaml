# Overlay adding SASL/PLAIN over SSL and broker ACL authorization using lab credentials.
# Client settings, healthchecks, and controller authorization must be rehearsed before recording.
# Paths resolve relative to this Compose file; credentials are isolated-lab defaults.

services:
  # Defines this service or named volume in the merged Compose project.
  broker-1:
    environment: &sasl_env
      KAFKA_LISTENERS: SASL_SSL://:19092,SASL_SSL_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://broker-1:19092,SASL_SSL_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_SSL:SASL_SSL,SASL_SSL_HOST:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_SASL_SSL_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret" user_admin="admin-secret" user_ledgerflow="ledgerflow-secret";
      KAFKA_LISTENER_NAME_SASL_SSL_HOST_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret" user_admin="admin-secret" user_ledgerflow="ledgerflow-secret";
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/ledgerflow/security/broker-1.keystore.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: ledgerflow
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/ledgerflow/security/truststore.p12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ledgerflow
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:admin
    volumes:
      - ../../security/tls:/etc/ledgerflow/security:ro
      - ../../security/sasl:/etc/ledgerflow/sasl:ro
  # Defines this service or named volume in the merged Compose project.
  broker-2:
    environment:
      <<: *sasl_env
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://broker-2:19092,SASL_SSL_HOST://localhost:39092
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/ledgerflow/security/broker-2.keystore.p12
    volumes:
      - ../../security/tls:/etc/ledgerflow/security:ro
      - ../../security/sasl:/etc/ledgerflow/sasl:ro
  # Defines this service or named volume in the merged Compose project.
  broker-3:
    environment:
      <<: *sasl_env
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://broker-3:19092,SASL_SSL_HOST://localhost:49092
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/ledgerflow/security/broker-3.keystore.p12
    volumes:
      - ../../security/tls:/etc/ledgerflow/security:ro
      - ../../security/sasl:/etc/ledgerflow/sasl:ro
