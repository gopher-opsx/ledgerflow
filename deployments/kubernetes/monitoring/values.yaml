# LedgerFlow local Kubernetes monitoring.
# Used in Lesson 35 with kube-prometheus-stack 89.2.0.
# Local kind environment only — not production defaults.

# Alert routing is outside this lesson.
alertmanager:
  enabled: false

# Reduce local resource usage by disabling bundled alert rules.
defaultRules:
  create: false

# These control-plane scrape endpoints are not assumed to be
# reachable from the default kind cluster.
kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

# Grafana includes preconfigured Kubernetes dashboards.
grafana:
  enabled: true
  defaultDashboardsEnabled: true

  # Explicitly provision the chart-managed Prometheus data source.
  # These are the kube-prometheus-stack defaults, stated here for clarity.
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true

  # Ephemeral storage is sufficient for local training.
  persistence:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# Single Prometheus instance with short retention.
prometheus:
  prometheusSpec:
    replicas: 1
    retention: 6h

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

# Manages Prometheus resources and reconciliation.
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi