apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: ledgerflow
  namespace: ledgerflow
spec:
  kafka:
    version: 4.3.1
    metadataVersion: "4.3-IV0"
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: ledgerflow
  labels:
    strimzi.io/cluster: ledgerflow
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Gi
        deleteClaim: true
