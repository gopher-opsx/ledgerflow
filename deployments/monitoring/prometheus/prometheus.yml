global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  - job_name: kafka-brokers
    static_configs:
      - targets:
          - jmx-exporter-broker-1:9404
          - jmx-exporter-broker-2:9404
          - jmx-exporter-broker-3:9404

  - job_name: transaction-api
    static_configs:
      - targets:
          - transaction-api:8080

  - job_name: kafka-consumer-lag
    static_configs:
      - targets:
          - kafka-exporter:9308